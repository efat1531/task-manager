name: Build and release Windows exe

# Build the executable and publish a GitHub Release whenever a version tag
# (e.g. v1.0.0) is pushed. Also runnable manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          app_version="$(python -c 'from version import APP_VERSION; print(APP_VERSION)')"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v${app_version}" ]; then
            echo "::error::Tag '$tag' does not match version.py APP_VERSION '$app_version' (expected 'v$app_version')."
            exit 1
          fi
          echo "Tag $tag matches APP_VERSION $app_version."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build executable
        run: pyinstaller task_manager.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: bash
        run: |
          app_version="$(python -c 'from version import APP_VERSION; print(APP_VERSION)')"
          # choco's innosetup package installs here but doesn't shim ISCC onto PATH.
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$iscc" "/DAppVersion=${app_version}" installer/task_manager.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-exe
          path: |
            dist/TaskManager.exe
            dist/TaskManager-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TaskManager.exe
            dist/TaskManager-Setup.exe
          # Hand-written notes for the tagged release (update RELEASE_NOTES.md
          # per release); the auto-generated changelog is appended after them.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
